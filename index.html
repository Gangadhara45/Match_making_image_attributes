<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchmaking Attributes Dashboard</title>
    <meta name="description" content="Real-time matchmaking attribute editor with SSE event streaming">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4">
                    <path
                        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                </svg>
            </div>
            <div class="header-tag">Match Making</div>
        </div>
        <div class="header-center">
            <h1>Match Making Attributes 💖</h1>
        </div>
        <div class="header-right">
            <div class="connection-status" id="connectionStatus">
                <span class="status-dot"></span>
                <span class="status-text">Disconnected</span>
            </div>
            <button class="btn btn-outline" id="loadSampleBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                    <path d="M12 5v14M5 12h14" />
                </svg>
                Load Sample
            </button>
        </div>
    </header>

    <div class="layout-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Profiles</h2>
                <span class="batch-count" id="batchCount">0</span>
            </div>
            <div class="sidebar-content" id="sidebarList">
                <!-- Profiles will be added here -->
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="empty-state" id="emptyState">
                <div class="empty-icon-wrapper">
                    <div class="empty-icon-pulse"></div>
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="64"
                            height="64">
                            <path
                                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                            <path
                                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                                opacity="0.4" />
                        </svg>
                    </div>
                </div>
                <h2>Waiting for profile Attributes… 🔍</h2>
                <p class="empty-hint">Or click <strong>Load Sample</strong> to see the preview</p>
            </div>

            <div class="cards-grid" id="cardsGrid"></div>
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
